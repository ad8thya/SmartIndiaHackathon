# Alembic config for URBAN TWIN. Run from the repo root:
#   make migrate      →  alembic -c packages/db/alembic.ini upgrade head
#   make revision m="…"

[alembic]
script_location = packages/db/src/db/migrations
prepend_sys_path = packages/contracts/src:packages/db/src:.
path_separator = os
# sqlalchemy.url is intentionally blank — env.py reads DATABASE_URL from .env so
# that nobody ever commits a password into this file.
sqlalchemy.url =

file_template = %%(rev)s_%%(slug)s

# No post_write_hooks. A `console_scripts` ruff hook looks right but always
# ends in `FAILED: Could not find entrypoint console_scripts.ruff`, because ruff
# ships as a standalone binary, not a python entrypoint — and an `exec` hook
# needs .venv/bin on PATH, which `make revision` does not guarantee.
# Generated migrations are excluded from ruff anyway (see pyproject.toml).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
