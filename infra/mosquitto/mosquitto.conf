# ─────────────────────────────────────────────────────────────────────────────
# URBAN TWIN — mosquitto 2.x config
#
# WITHOUT THIS FILE THE BROKER STARTS AND THEN REFUSES EVERY CONNECTION.
# mosquitto 2.0 changed the default to `allow_anonymous false` + localhost-only
# listener, so a container with no config is effectively a black hole.
# ─────────────────────────────────────────────────────────────────────────────

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

# hackathon / demo broker — no auth. DO NOT ship this to a public network.
allow_anonymous true

# plain MQTT for the python side (replay publisher, api subscriber)
listener 1883 0.0.0.0
protocol mqtt

# websockets for browsers that want to subscribe to bus/# directly
listener 9001 0.0.0.0
protocol websockets

max_queued_messages 10000
message_size_limit 1048576
