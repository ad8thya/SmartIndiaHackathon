# ─────────────────────────────────────────────────────────────────────────────
# URBAN TWIN infrastructure.
#
#   make dev       → postgres + redis + mosquitto in docker,
#                    api + replay + vite run LOCALLY with hot reload (fast loop)
#   make up-full   → everything in docker, including the api (`full` profile)
# ─────────────────────────────────────────────────────────────────────────────
name: urban-twin

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: ut-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-urbantwin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-urbantwin}
      POSTGRES_DB: ${POSTGRES_DB:-urbantwin}
      # deterministic collation so ORDER BY is identical on every laptop
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-urbantwin} -d ${POSTGRES_DB:-urbantwin}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: ut-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports:
      # host port is overridable: a local Homebrew redis on 6379 is common and
      # would otherwise stop the whole stack from coming up
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: ut-mosquitto
    restart: unless-stopped
    # mosquitto 2.x refuses every remote connection without an explicit config.
    # infra/mosquitto/mosquitto.conf is REQUIRED — do not delete it.
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqttdata:/mosquitto/data
    ports:
      - "${MQTT_PORT:-1883}:1883"      # tcp — python clients (replay, api)
      - "${MQTT_WS_PORT:-9001}:9001"   # ws  — browser clients (optional direct subscribe)
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -p 1883 -t '$$SYS/#' -C 1 -W 3 -q 0 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    profiles: ["full"]
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    container_name: ut-api
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-urbantwin}:${POSTGRES_PASSWORD:-urbantwin}@postgres:5432/${POSTGRES_DB:-urbantwin}
      REDIS_URL: redis://redis:6379/0
      MQTT_HOST: mosquitto
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./services:/app/services:ro
      - ./packages:/app/packages:ro
      - ./scripts:/app/scripts:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    command: >
      uvicorn services.api.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
  mqttdata:
