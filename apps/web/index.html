<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover + safe-area padding keeps /field and the citizen
         screens correct under a real phone's notch; harmless on desktop -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#080b14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>URBAN TWIN · Chennai</title>
    <meta name="description" content="Public transport buses as mobile sensors feeding a live urban Digital Twin." />
    <!-- Inter is vendored under /fonts and declared in styles/index.css. It is
         deliberately NOT loaded from Google Fonts: `make demo` has to work with
         the wifi off, and a venue network that resolves but stalls is worse
         than no network at all — the page would block on the stylesheet. -->
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
